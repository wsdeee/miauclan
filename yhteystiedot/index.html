<style>
:root{color-scheme:dark;--bg:#0b0c10;--bg-surface:#15161b;--text:#f4f2ed;--text-muted:#9a9ea6;--accent:#ff3b5c;--accent-ink:#0b0c10;--border:#262830;--font-display:'Unbounded','Arial Black',sans-serif;--font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;--ease:cubic-bezier(.22,.61,.36,1)}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg)}body{font-family:var(--font-body);color:var(--text);-webkit-font-smoothing:antialiased}
.gate{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:var(--bg);transition:opacity .6s var(--ease)}.gate--leaving{opacity:0;pointer-events:none}.gate-inner{display:flex;flex-direction:column;align-items:center;gap:1.5rem;padding:1.5rem;text-align:center}.gate-logo{display:block;width:clamp(6rem,20vw,9rem);height:auto}.gate-wordmark{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(2.2rem,7vw,4.5rem)}
.enter-btn{font-family:var(--font-body);font-weight:600;font-size:.9rem;letter-spacing:.14em;color:var(--text);background:transparent;border:1px solid var(--text);border-radius:6px;padding:.95rem 2.75rem;cursor:pointer;transition:background .25s var(--ease),color .25s var(--ease),border-color .25s var(--ease)}
.enter-btn:hover,.enter-btn:focus-visible{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.site{opacity:0;transition:opacity .7s var(--ease) .1s}.site--visible{opacity:1}
.wrap{max-width:720px;margin:0 auto;padding:0 1.5rem}
.site-header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;padding:2rem 0}
.wordmark-small{display:inline-flex;align-items:center;gap:.55rem;font-family:var(--font-display);font-weight:800;font-size:1.05rem;color:var(--text);text-decoration:none}
.brand-logo{display:block;width:1.8rem;height:1.8rem;object-fit:contain}
.header-right{display:flex;align-items:center;gap:1.5rem;flex-wrap:wrap}
.text-link{font-size:.85rem;color:var(--text-muted);text-decoration:none}
.text-link:hover{color:var(--text)}
.text-link--active{color:var(--text)}
.social-row{display:flex;gap:.5rem}
.social-tag{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border:1px solid var(--border);border-radius:6px;color:var(--text-muted);text-decoration:none;transition:background .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease),transform .15s var(--ease)}
.social-tag:hover,.social-tag:focus-visible{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);transform:translateY(-1px)}
.social-tag svg{width:16px;height:16px;display:block;fill:currentColor}
.hero{padding:2.5rem 0 1.5rem;border-top:1px solid var(--border)}
.accent-bar{display:block;width:56px;height:6px;margin-bottom:1.75rem;background:var(--accent);clip-path:polygon(0 0,100% 0,88% 100%,0 100%)}
.hero-headline{margin:0 0 1rem;font-family:var(--font-display);font-weight:800;font-size:clamp(2rem,5vw,3rem);line-height:1.1}
.hero-sub{margin:0;color:var(--text-muted);font-size:1rem;line-height:1.5}
section{padding:2rem 0;border-top:1px solid var(--border)}
h3{margin:0 0 1.25rem;font-family:var(--font-display);font-weight:600;font-size:1.1rem}
.contact-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border);border:1px solid var(--border);margin-top:.5rem}
.contact-card{display:flex;flex-direction:column;gap:.85rem;background:var(--bg);padding:1.75rem 1.5rem;transition:background .25s var(--ease)}
.contact-card:hover{background:var(--bg-surface)}
.contact-label{color:var(--text-muted);font-size:.9rem}
.contact-value{font-family:var(--font-display);font-weight:600;font-size:1rem;color:var(--text);text-decoration:none}
.contact-value:hover{color:var(--accent)}
.site-footer{padding:2rem 0 3rem;border-top:1px solid var(--border);color:var(--text-muted);font-size:.85rem}
@media(max-width:640px){.contact-grid{grid-template-columns:1fr}}
</style>
</head>

<script>(function(){var g=document.getElementById('gate'),s=document.getElementById('site'),b=document.getElementById('enterBtn');if(!g||!s||!b)return;var e=false;try{e=sessionStorage.getItem('miau_entered')==='1'}catch(x){}if(e){g.style.display='none';document.body.classList.add('entered');s.classList.add('site--visible');return}b.addEventListener('click',function(){try{sessionStorage.setItem('miau_entered','1')}catch(x){}document.body.classList.add('entered');g.classList.add('gate--leaving');s.classList.add('site--visible');setTimeout(function(){g.style.display='none'},650)});})();</script>
